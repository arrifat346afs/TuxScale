name: Flatpak Build Test

on:
  workflow_dispatch:

jobs:
  flatpak-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build Electron app
        run: |
          npm install
          npm run build

      - name: Package app and generate local manifest
        run: |
          MANIFEST=$(ls *.yml | head -1)
          APP_ID=$(grep '^app-id:' $MANIFEST | awk '{print $2}')
          echo "APP_ID=$APP_ID" >> $GITHUB_ENV

          npx electron-builder --linux zip
          ZIP=$(ls dist/tuxscale-*.zip | head -1)
          SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)
          cp "$ZIP" flatpak/tuxscale-linux.zip

          perl -0pe 's/\\\n\s{2,}//g' "$MANIFEST" | \
            sed "s|url: https://github.com/.*TuxScale/releases/download/.*|path: tuxscale-linux.zip|; \
                 s|sha256: [a-f0-9]*|sha256: $SHA256|" \
            > "flatpak/local.yml"

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: TuxScale.flatpak
          manifest-path: flatpak/local.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
          artifact-name: TuxScale-x86_64.flatpak
