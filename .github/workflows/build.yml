name: Build and Release

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS model weights
        run: |
          for f in resources/models/*.pth; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1048576 ]; then
              echo "::error file=$f::Model weights file $f is smaller than 1 MB ($size bytes), likely an unfetched Git LFS pointer stub."
              exit 1
            fi
            if head -n 1 "$f" | grep -q "^version https://git-lfs"; then
              echo "::error file=$f::Model weights file $f starts with 'version https://git-lfs' (unfetched Git LFS pointer stub)."
              exit 1
            fi
          done
          echo "All model weights in resources/models/ verified successfully."

      - name: Maximize build disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools zstd jq unzip

      - name: Download latest backend binary (upscayl-bin)
        run: bash scripts/download-linux-binaries.sh

      - name: Bundle Python runtime and PyTorch with CUDA
        run: bash scripts/bundle-python-env.sh

      - name: Install dependencies
        run: bun install

      - name: Build Linux packages
        run: bun run build:linux

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuxscale-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.yml
            dist/*.yaml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: tuxscale-linux
          path: release-assets

      - name: Prepare and check release asset sizes (split if >= 2GB)
        run: |
          set -euo pipefail
          echo "==> Inspecting release assets before release upload..."
          ls -lh release-assets

          # GitHub Release Asset limit is strictly 2 GiB (2,147,483,648 bytes)
          # Use 2000 MB (2,097,152,000 bytes) threshold to ensure a safe margin
          MAX_BYTES=2097152000
          SPLIT_OCCURRED=0

          for f in release-assets/*; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            base=$(basename "$f")

            if [ "$size" -gt "$MAX_BYTES" ]; then
              echo "⚠️  Asset $base ($size bytes) exceeds GitHub 2 GiB limit. Splitting into 1900MB chunks..."
              split -b 1900M --numeric-suffixes=1 "$f" "${f}.part"
              rm -f "$f"
              SPLIT_OCCURRED=1
              echo "✓ Split $base into chunks:"
              ls -lh "${f}.part"*
            else
              echo "✓ Asset $base ($size bytes) is well within GitHub 2 GiB limit."
            fi
          done

          if [ "$SPLIT_OCCURRED" -eq 1 ]; then
            printf "%s\n" \
              "To rejoin any multi-part release asset (e.g. .part01, .part02):" \
              "" \
              "Linux / macOS:" \
              "  cat <filename>.part* > <filename>" \
              "  chmod +x <filename>   # if AppImage" \
              "" \
              "Windows (Command Prompt):" \
              "  copy /b <filename>.part01 + <filename>.part02 <filename>" \
              > release-assets/HOW_TO_JOIN_SPLIT_ASSETS.txt
          fi

          echo "==> Final list of release assets to upload:"
          ls -lh release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-linux.outputs.version }}
          name: TuxScale v${{ needs.build-linux.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
