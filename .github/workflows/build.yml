name: Build Native Linux

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config nasm \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shm0-dev \
            libwayland-dev libvulkan-dev libssl-dev libasound2-dev libudev-dev \
            libdbus-1-dev libegl1-mesa-dev libgit2-dev zlib1g-dev ffmpeg \
            ruby ruby-dev rpm libarchive-tools zstd squashfs-tools desktop-file-utils
          sudo gem install fpm --version 1.17.0 --no-document

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Verify model assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for model in Path('resources/models').iterdir():
              if model.suffix in ('.pth', '.bin'):
                  with model.open('rb') as stream:
                      assert not stream.read(128).startswith(b'version https://git-lfs'), f'Unfetched LFS model: {model}'
          PY

      - name: Check formatting
        run: cargo fmt --manifest-path app/Cargo.toml -- --check

      - name: Test native application
        run: cargo test --locked --manifest-path app/Cargo.toml

      - name: Build and validate Linux packages
        run: bash app/scripts/package-formats.sh

      - uses: actions/upload-artifact@v4
        with:
          name: tuxscale-native-linux
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.rpm
            app/dist/*.pkg.tar.zst
            app/dist/*.tar.gz
            app/dist/SHA256SUMS
          compression-level: 0
          if-no-files-found: error

  release-linux:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    needs: build-linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine release version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' app/Cargo.toml | head -n 1)"
          test -n "$version"
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/}" != "$tag" ]]; then
            echo "Tag $GITHUB_REF does not match app version $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: tuxscale-native-linux
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          assets=(dist/*.AppImage dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.tar.gz dist/SHA256SUMS)
          for asset in "${assets[@]}"; do test -s "$asset"; done
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "TuxScale $RELEASE_TAG" \
              --generate-notes
          fi
