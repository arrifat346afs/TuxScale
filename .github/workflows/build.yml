name: Build Native Linux

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, codex/rust-gpui-migration]

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config nasm \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb-xinput-dev libxcb-xkb-dev libxcb-render0-dev libxcb-shm0-dev \
            libwayland-dev libvulkan-dev libssl-dev libasound2-dev libudev-dev \
            libdbus-1-dev libegl1-mesa-dev libgit2-dev zlib1g-dev ffmpeg

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable

      - name: Verify model assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for model in Path('resources/models').iterdir():
              if model.suffix in ('.pth', '.bin'):
                  with model.open('rb') as stream:
                      assert not stream.read(128).startswith(b'version https://git-lfs'), f'Unfetched LFS model: {model}'
          PY

      - name: Check formatting
        run: cargo fmt --manifest-path rust-app/Cargo.toml -- --check

      - name: Test native application
        run: cargo test --locked --manifest-path rust-app/Cargo.toml

      - name: Build Linux AppDir
        run: bash rust-app/scripts/package-linux.sh

      - name: Archive native package
        run: tar -C rust-app/dist -czf rust-app/dist/TuxScale-linux-x86_64.tar.gz TuxScale.AppDir

      - uses: actions/upload-artifact@v4
        with:
          name: tuxscale-native-linux
          path: rust-app/dist/TuxScale-linux-x86_64.tar.gz
          if-no-files-found: error
