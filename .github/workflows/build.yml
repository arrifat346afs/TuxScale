name: Build and Release

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Packages
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Verify Git LFS model weights
        run: |
          for f in resources/models/*.pth; do
            [ -e "$f" ] || continue
            size=$(stat -c%s "$f")
            if [ "$size" -lt 1048576 ]; then
              echo "::error file=$f::Model weights file $f is smaller than 1 MB ($size bytes), likely an unfetched Git LFS pointer stub."
              exit 1
            fi
            if head -n 1 "$f" | grep -q "^version https://git-lfs"; then
              echo "::error file=$f::Model weights file $f starts with 'version https://git-lfs' (unfetched Git LFS pointer stub)."
              exit 1
            fi
          done
          echo "All model weights in resources/models/ verified successfully."

      - name: Maximize build disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools zstd jq unzip

      - name: Download latest backend binary (upscayl-bin)
        run: bash scripts/download-linux-binaries.sh

      - name: Bundle Python runtime and PyTorch with CUDA
        run: bash scripts/bundle-python-env.sh

      - name: Install dependencies
        run: bun install

      - name: Build Linux packages
        run: bun run build:linux

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tuxscale-linux
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: tuxscale-linux
          path: release-assets

      - name: List release assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-linux.outputs.version }}
          release_name: TuxScale v${{ needs.build-linux.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
