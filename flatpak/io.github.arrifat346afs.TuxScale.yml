app-id: io.github.arrifat346afs.TuxScale
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '25.08'
command: tuxscale-run
separate-locales: false

finish-args:
  - --device=dri
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=host
  - --filesystem=home
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

modules:
  - name: tuxscale
    buildsystem: simple
    sources:
      - type: file
        path: tuxscale-linux.zip
      - type: file
        path: ../io.github.arrifat346afs.TuxScale.metainfo.xml
      - type: file
        path: ../io.github.arrifat346afs.TuxScale.desktop
      - type: script
        dest-filename: tuxscale-run
        commands:
          - exec zypak-wrapper /app/tuxscale/tuxscale --ozone-platform-hint=auto --enable-features=WaylandWindowDecorations "$@"
    build-commands:
      - install -d /app/tuxscale
      - bsdtar -xf tuxscale-linux.zip -C /app/tuxscale
      - install -Dm755 tuxscale-run /app/bin/tuxscale-run
      - install -Dm644 /app/tuxscale/resources/512x512.png /app/share/icons/hicolor/512x512/apps/io.github.arrifat346afs.TuxScale.png
      - install -Dm644 /app/tuxscale/resources/128x128.png /app/share/icons/hicolor/128x128/apps/io.github.arrifat346afs.TuxScale.png
      - install -Dm644 io.github.arrifat346afs.TuxScale.metainfo.xml /app/share/metainfo/io.github.arrifat346afs.TuxScale.metainfo.xml
      - install -Dm644 io.github.arrifat346afs.TuxScale.desktop /app/share/applications/io.github.arrifat346afs.TuxScale.desktop
      - if [ -f /app/tuxscale/LICENSE ]; then install -Dm644 /app/tuxscale/LICENSE -t /app/share/licenses/io.github.arrifat346afs.TuxScale/; fi
